# llm-orch configuration example
# ==============================
# Copy to config.yaml and adjust for your setup.

# ---------------------------------------------------------------------------
# Server settings
# ---------------------------------------------------------------------------
server:
  # Address and port the HTTP server listens on.
  listen: "127.0.0.1:8080"

  # Port range for backend instance allocation.  Each spawned backend
  # instance gets a port from this range.  Use "ephemeral" to let the OS
  # pick a free port for every instance.
  port_range:
    start: 9000
    end: 9100
  # port_range: "ephemeral"

  # Total timeout (seconds) for non-streaming backend requests.  Must
  # cover worst-case prefill + generation, since non-streaming responses
  # only materialize once generation is complete.  0 disables.
  # backend_total_timeout_secs: 900   # default

  # Idle timeout (seconds) for streaming backend requests: maximum gap
  # between SSE chunks (and until the first response headers) before the
  # backend is considered hung.  0 disables.
  # backend_idle_timeout_secs: 300    # default

  # Seconds to wait for in-flight requests to drain on shutdown before
  # aborting the remaining connections.
  # shutdown_drain_timeout_secs: 60   # default

  # Unconditional unload of idle instances after this many seconds without
  # requests — the "deep sleep" bound for the GPUs.  The per-model
  # `idle_ttl` is only a protection window against make-room eviction
  # (an instance younger than that is never evicted to make room); this
  # global timeout is what actually unloads idle models.
  # Maximum accepted scheduler wait (seconds).  0 means no scheduler
  # deadline; clients/proxies can still disconnect their request.
  # queue_wait_timeout_secs: 3600     # default

  # SSE comment heartbeat cadence while a request waits for a slot, spawn,
  # or migration.  Must be greater than zero.
  # queue_heartbeat_secs: 10          # default

  # EMA window (m1 | m5 | m15) used for autoscale scale-up / scale-down
  # decisions, server-global for all models.  m1 reacts to bursts within
  # a minute — with quick cold starts it frees VRAM fast after a burst
  # ends; m5/m15 smooth the signal at the cost of slower reaction.
  # scale_up_value: m1                # default
  # scale_down_value: m1              # default

  # Maximum migration transition duration. 0 allows active victim requests
  # to finish without a migration deadline; it never kills active requests.
  # migration_timeout_secs: 0         # default

  # Victim ordering policy. Only lru is currently implemented.
  # eviction_policy: lru              # default

  # drain_idle_timeout_secs: 3600     # default

  # Default diffusion model for native passthrough endpoints
  # (`/sdapi/v1/*`, `/sdcpp/v1/*`) which have no `model` field.
  # When unset, passthrough requests must specify `X-LLM-Model` header.
  # default_diffusion_model: "flux-1-dev"

# ---------------------------------------------------------------------------
# API keys
# ---------------------------------------------------------------------------
# Path to the API keys file (one key per line, optional # comment suffix).
# Hot-reloaded at runtime; changes take effect without restart.
apikeys_file: "apikeys.txt"

# ---------------------------------------------------------------------------
# Key files (remote model authentication)
# ---------------------------------------------------------------------------
# Named files whose *contents* are substituted as `{name}` placeholders in
# the `remote_auth` field of remote models (see Example 8).  Typical use:
# a bearer token or API key for a remote http(s) endpoint, kept out of the
# config file itself.
#
# - The files must exist at load / `--check-config` time (path is
#   validated; contents are read at startup, on config hot-reload, and
#   when the files themselves change on disk — no restart needed).
# - Contents are trimmed; a trailing newline in the file is not part of
#   the substituted value.
# - Names `port`, `context_length`, `max_concurrent`, and `name` are
#   reserved (they would shadow runtime placeholders).
# key_files:
#   deploy_key: /etc/llm-orch/keys/deploy.key
#   peer_key_cortana: /etc/llm-orch/keys/cortana.key

# ---------------------------------------------------------------------------
# Cluster peering (gateway mode) — see docs/006-cluster-peering.md
# ---------------------------------------------------------------------------
# This instance's node name.  When set, local models are additionally
# addressable as `<node_name>/<model>`, and a leading `<node_name>/` (or
# any other unknown first path segment — a client-side provider prefix
# such as `llm/`) is stripped during model resolution.  Peer models are
# addressed as `<peer>/<model>` (pinned) or bare `<model>` (unique name).
# node_name: cheyenne

# Leaf llm-orch instances whose models this instance re-exports.  Each
# peer is an ordinary llm-orch: it sees a single client holding one
# apikey (`remote_auth`).  Its models surface as remote models under
# `<peer>/<model>` plus a bare-name alias when unique.  Catalogs are
# fetched lazily (request routing, /v1/models, pre-hot-reload) — no
# background poller.  Admin actions, /v1/requests/{id}, and the stats /
# info unions are proxied / merged across peers.
# peers:
#   - name: cortana                 # [a-z0-9-]+, part of model names
#     url: "http://cortana.lan:8080"
#     remote_auth: "Bearer {peer_key_cortana}"
#     catalog_ttl_secs: 60          # lazy catalog refresh threshold
#     max_concurrent: 64            # shim-side circuit breaker
#     # include: ["qwen-*"]         # optional re-export filters (* globs)
#     # exclude: ["*-draft"]

# ---------------------------------------------------------------------------
# Device mapping
# ---------------------------------------------------------------------------
# Map backend device indices to PCI slots.  The indices here are what
# GGML_VK_VISIBLE_DEVICES, HIP_VISIBLE_DEVICES, and similar env vars use —
# they correspond to the backend's enumeration order (e.g. Vulkan0 → 0,
# ROCm0 → 0).
#
# Every GPU-pinned llama.cpp model is spawned with BOTH the namespace's
# visibility env var and an explicit `--device <Vulkan|CUDA|ROCm><rank>,…`
# selector.  The selector names ranks in the *visible* set: the env var
# renumbers devices from 0 in list order, so a placement on host devices
# [2, 4] becomes e.g. GGML_VK_VISIBLE_DEVICES=2,4 + `--device Vulkan0,Vulkan1`.
# Without the selector a multi-backend llama-server build (Vulkan + ROCm,
# Vulkan + CUDA) would enumerate the other backend's GPUs as well and
# row-split the instance across all of them — outside the scheduler's
# placement and VRAM accounting.  Declaring `--device`/`-dev` (or a
# draft-device flag) in a model's `cmd` is a config error for the same
# reason; keep a draft model on the CPU with `--spec-draft-ngl 0`.
devices:
  vulkan:
    0: "0000:03:00.0"  # dGPU — find with `llama-server --list-devices`
    # 1: "0000:7b:00.0" # iGPU — too small for LLMs

  # ROCm (AMD) devices — separate namespace.  Models reference these
  # indices via `rocm_devices` (mutually exclusive with `vulkan_devices`
  # and `cuda_devices` on the same model) and are pinned via
  # HIP_VISIBLE_DEVICES plus llama.cpp's explicit `--device ROCmN`.
  # The PCI mapping may refer to the same physical AMD card as `vulkan`;
  # the scheduler accounts for both namespaces by PCI slot.
  # rocm:
  #   0: "0000:03:00.0"
  #   1: "0000:7b:00.0"

  # Optional per-GPU VRAM limits (MB), shared by Vulkan and ROCm indices.
  # Caps the sysfs-reported total; for GPUs with no metrics reader at all
  # (e.g. an Intel iGPU on Vulkan) an explicit limit is also the declared
  # total that makes the device placeable.  Without metrics and without a
  # limit, a Vulkan/ROCm device is unusable for VRAM-aware placement.
  # vram_limit_mb:
  #   0: 24576

  # CUDA (NVIDIA) devices — separate namespace.  Models reference these
  # indices via `cuda_devices` (mutually exclusive with `vulkan_devices`
  # and `rocm_devices` on the same model) and are pinned via
  # CUDA_VISIBLE_DEVICES.
  # PCI slots are validated against /sys/bus/pci/devices/; find them with
  # `nvidia-smi --query-gpu=pci.bus_id --format=csv,noheader` (strip the
  # domain down to 4 hex digits: 00000000:65:00.0 → 0000:65:00.0).
  #
  # `vram_mb` (optional): static VRAM total in MB.  Doubles as a
  # capacity cap over the nvidia-smi-reported total and as the fallback
  # total when nvidia-smi is unavailable — set it if nvidia-smi is not
  # on llm-orch's PATH.
  # cuda:
  #   0:
  #     pci: "0000:65:00.0"
  #     vram_mb: 24576
  #   1:
  #     pci: "0000:c1:00.0"
  #     vram_mb: 24576

# ---------------------------------------------------------------------------
# Command aliases
# ---------------------------------------------------------------------------
# Named `{key}` → value fragments substituted into model `cmd` fields.
# Use `{alias_name}` in any model's `cmd` to include the alias value.
# Runtime placeholders resolved at spawn time: `{port}` (allocated port),
# `{context_length}` (the model's context_length), `{max_concurrent}`
# (the model's max_concurrent), `{name}` (the model's config name).
cmd_aliases:
  llama: |
    llama-server
      --host 127.0.0.1
      --port {port}
      --n-gpu-layers 99

  # CPU-only variant of the llama alias.  Models without a device pool
  # (no vulkan_devices/cuda_devices/rocm_devices) are CPU-only: llm-orch pins no GPU
  # and injects --n-gpu-layers 0 itself when the command declares no
  # offload count — stating it here keeps the command self-documenting.
  llama-cpu: |
    llama-server
      --host 127.0.0.1
      --port {port}
      --n-gpu-layers 0

  # audio.cpp (audiocpp_server) — one server process per model.  `{name}`
  # resolves to the model's config name, so a single alias serves every
  # audio model: name `qwen3-tts` → /etc/llm-orch/audio/qwen3-tts.json.
  # The server.json's model `id` must equal the llm-orch model name
  # (audiocpp validates the request's `model` field against it).
  # See config.example-audiocpp.json for the server.json shape.
  # audiocpp: |
  #   audiocpp_server
  #     --config /etc/llm-orch/audio/{name}.json
  #     --host 127.0.0.1
  #     --port {port}
  #     --backend vulkan

  # sd-server (stable-diffusion.cpp) — diffusion model server.  One server
  # process per model.  `{name}` resolves to the model's config name.
  # `--diffusion-model` points to the actual weights file (safetensors,
  # ckpt, or gguf) for the selected model.  Use {vulkan} or {cuda} variants
  # depending on the backend build of sd-server.
  # sd: |
  #   sd-server
  #     --host 127.0.0.1
  #     --port {port}
  #     --diffusion-model /models/{name}.safetensors
  #     --vae /models/vae.safetensors
  #     --backend vulkan
  #
  # sd-cpu: |
  #   sd-server
  #     --host 127.0.0.1
  #     --port {port}
  #     --diffusion-model /models/{name}.safetensors
  #     --backend cpu

# ---------------------------------------------------------------------------
# GPU keep-alive
# ---------------------------------------------------------------------------
# Prevent the kernel driver from auto-suspending a GPU while models are
# loaded.  The command runs periodically per active GPU and stops when the
# last instance on that GPU is unloaded.
#
# AMD Vulkan/ROCm only — NVIDIA GPUs are not auto-suspended this way
# (enable persistence mode instead: `nvidia-smi -pm 1`).
#
# keep_alive:
#   amd:
#     cmd: "cat /sys/class/drm/card{index}/device/gpu_busy_percent > /dev/null"
#     sleep: 5

# ---------------------------------------------------------------------------
# Token / model statistics
# ---------------------------------------------------------------------------
# Opt-in.  When set, per-model counters are tracked in two sets —
# `total` (persisted across restarts) and `boot` (since this process
# started): served requests, prompt / cached / completion tokens, TTFT
# (min/avg/max, streaming), request duration (sum/avg) — and the JSON
# file is atomically rewritten after every served request.  Exposed on
# the auth-gated `GET /v1/stats` endpoint (counters + current GPU
# metrics), which Home Assistant's HTTP integration can poll directly.
#
# stats:
#   file: /var/lib/llm-orch/stats.json

# ---------------------------------------------------------------------------
# MQTT publishing (optional) — see docs/007-mqtt-stats.md
# ---------------------------------------------------------------------------
# Pushes the same documents as GET /v1/stats to an MQTT broker in addition
# to (or instead of) polling.  Topics (retained by default):
#   {prefix}/{node}/status   "online" / "offline" (LWT covers crashes)
#   {prefix}/{node}/stats    counters + GPU metrics + delta-derived rates
#   {prefix}/{node}/models   catalog discovery doc
#   {prefix}/{node}/gpus     GPU inventory (static fields)
#   {prefix}/{peer}/stats    gateway re-export of each leaf's cached doc
# Publishing is change-only: every tick rebuilds the docs and publishes a
# topic only when its content differs from the last publish; every broker
# reconnect force-republishes everything.  Requires node_name.  A dead
# broker never affects request serving.
#
# mqtt:
#   broker: "mqtt.home.lan:1883"   # or mqtts://host, host:port
#   prefix: llmorch                # topic prefix before /{node}/…
#   interval: 60                   # seconds between change checks
#   qos: 1                         # 0 or 1
#   retain: true
#   username: llm-orch             # optional
#   key: "{mqtt_password}"         # {name} resolved from key_files (0400)
#   tls: false                     # force TLS for plain host:port addresses

# ---------------------------------------------------------------------------
# Model definitions
# ---------------------------------------------------------------------------
models:
  # --- Example 1: a large GPU-resident model --------------------------------
  - name: "qwen3-32b"
    context_length: 32768
    max_instances: 2          # at most 2 instances across all GPUs
    max_concurrent: 4         # up to 4 parallel requests per instance
    priority: 100             # higher = less likely to be evicted
    vram: 24000               # declared VRAM usage (MB) for scheduler hints
    ram: 0                    # declared system RAM usage (MB)
    idle_ttl: 300             # unload after 5 min of inactivity (seconds)
    queue_depth: 20           # max queued requests before returning 429
    vulkan_devices: [0]       # run on Vulkan device 0

    # Load-based autoscaling (see the README "Autoscaling" section).
    # Thresholds are explicit integral counts of *active* requests
    # (in_flight + queued).  With max_concurrent: 4, a second instance
    # spawns once the queue EMA exceeds scale_up_at − max_concurrent = 3,
    # and it is despawned again once the active EMA drops below
    # scale_down_at = 4 (the remaining instance stays below capacity).
    # The EMA windows (m1/m5/m15) are chosen server-globally via
    # server.scale_up_value / server.scale_down_value (default m1/m1).
    autoscale:
      enabled: true
      scale_up_at: 7          # spawn when active-EMA > 7 (queue-EMA > 3)
      scale_down_at: 4        # despawn when active-EMA < 4
      cooldown_secs: 120      # min. seconds between any two scale actions

    cmd: |
      {llama}
        --model /models/qwen3-32b-q4_k_m.gguf
        --ctx-size {context_length}   # substituted from the model's context_length
        --parallel {max_concurrent}   # substituted from the model's max_concurrent

  # --- Example 2: a model too large for one GPU — spans two ----------------
  # `gpus: 2` splits the model evenly across two devices (llama.cpp's
  # default tensor split over the selected backend's visibility variable).
  # `vram` is
  # reserved on EACH occupied GPU, so this reserves 2×20000 MB; the
  # orchestrator picks two devices from the pool with enough free VRAM
  # each.  For asymmetric splits use --tensor-split in cmd and set vram
  # to the largest per-GPU share.
  #
  # Alternative: instead of a flat pool + `gpus`, list explicit placement
  # alternatives — each inner list is one complete device set an instance
  # may use, and its length is the span.  `[[0],[1]]` is single-GPU
  # (either one is fine), `[[0,1]]` is dual-GPU (using both).  With this
  # form `gpus` must stay 1.  These placements also pin a speculative-
  # decoding draft model (see Example 5): the draft runs on exactly the
  # device(s) of the instance's placement.
  #   vulkan_devices: [[0], [1]]    # one GPU per instance
  #   vulkan_devices: [[0, 1]]      # both GPUs per instance
  # - name: "qwen3.6-27b-q8"
  #   context_length: 32768
  #   max_instances: 1
  #   max_concurrent: 4
  #   vram: 20000             # MB reserved per occupied GPU
  #   gpus: 2                 # devices each instance spans (default 1)
  #   idle_ttl: 600
  #   queue_depth: 10
  #   vulkan_devices: [0, 1, 2, 3]
  #   cmd: |
  #     {llama}
  #       --model /models/qwen3.6-27b-q8_0.gguf
  #       --ctx-size 32768

  # --- Example 2b: a CUDA model — CUDA_VISIBLE_DEVICES + --device CUDA0 ---
  # - name: "qwen3-14b-cuda"
  #   context_length: 32768
  #   max_instances: 1
  #   max_concurrent: 4
  #   vram: 12000
  #   idle_ttl: 300
  #   queue_depth: 20
  #   cuda_devices: [0, 1]      # pool: CUDA devices 0 and 1
  #   cmd: |
  #     {llama}
  #       --model /models/qwen3-14b-q4_k_m.gguf
  #       --ctx-size 32768

  # --- Example 2c: a CUDA model spanning two GPUs ---------------------------
  # `gpus: 2` selects two devices from the `cuda_devices` pool and pins
  # them as CUDA_VISIBLE_DEVICES=<a>,<b> + --device CUDA0,CUDA1 (selection
  # order = emission order = post-filter rank order); `vram` is reserved
  # on EACH occupied GPU.
  # - name: "qwen3-32b-cuda"
  #   context_length: 32768
  #   max_instances: 1
  #   max_concurrent: 4
  #   vram: 20000             # MB reserved per occupied GPU
  #   gpus: 2
  #   idle_ttl: 600
  #   queue_depth: 10
  #   cuda_devices: [0, 1]
  #   cmd: |
  #     {llama}
  #       --model /models/qwen3-32b-q4_k_m.gguf
  #       --ctx-size 32768

  # --- Example 2d: a ROCm model — HIP_VISIBLE_DEVICES + --device ROCmN ---
  # The N values are ranks in the HIP-visible set, so a selected pool
  # [2, 4] becomes HIP_VISIBLE_DEVICES=2,4 and --device ROCm0,ROCm1 — the
  # same rank naming every namespace gets.  A ROCm model may use the same
  # physical AMD GPU as a Vulkan model when VRAM permits.
  # - name: "qwen3-32b-rocm"
  #   context_length: 32768
  #   max_instances: 1
  #   max_concurrent: 4
  #   vram: 20000             # MB reserved per occupied GPU
  #   gpus: 1
  #   idle_ttl: 600
  #   queue_depth: 10
  #   rocm_devices: [0, 1]    # pool: ROCm devices 0 and 1
  #   cmd: |
  #     {llama}
  #       --model /models/qwen3-32b-q4_k_m.gguf
  #       --ctx-size 32768

  # --- Example 3: a smaller model — runs on CPU ----------------------------
  # No device pool (Vulkan, CUDA, or ROCm) = CPU-only: llm-orch pins no GPU
  # and enforces --n-gpu-layers 0 (declared in the {llama-cpu} alias).  `ram` declares
  # the system RAM footprint — weights plus KV cache at the configured
  # context length (informational today).
  - name: "deepseek-coder-7b"
    context_length: 16384
    max_instances: 1
    max_concurrent: 8
    priority: 50
    vram: 0
    ram: 6000
    idle_ttl: 120             # unload after 2 min
    queue_depth: 10
    # vulkan_devices: [0]     # uncomment (and use {llama}) for GPU offload

    cmd: |
      {llama-cpu}
        --model /models/deepseek-coder-7b-q4_k_m.gguf
        --ctx-size 16384

  # --- Example 3b: a pure-CPU embedding model -------------------------------
  # Same CPU-only pattern, ideal for small embedding/rerank models: omit
  # every device pool, keep `gpus: 1` (the default), and llm-orch spawns
  # the server with --n-gpu-layers 0 enforced — it never touches a GPU,
  # even on a multi-GPU host.  Requesting GPU offload in the command of a
  # deviceless model is a config error.
  # - name: "bge-m3-embed"
  #   context_length: 8192
  #   max_instances: 2        # CPU models scale out by parallel processes
  #   max_concurrent: 8
  #   vram: 0
  #   ram: 2500
  #   idle_ttl: 300
  #   queue_depth: 20
  #   cmd: |
  #     {llama-cpu}
  #       --model /models/bge-m3-q8_0.gguf
  #       --ctx-size 8192
  #       --embeddings

  # --- Example 3: a multimodal model ----------------------------------------
  - name: "llava-13b"
    context_length: 4096
    max_instances: 1
    max_concurrent: 2
    priority: 75
    vram: 14000
    ram: 0
    idle_ttl: 600            # keep vision models around longer (10 min)
    queue_depth: 5
    vulkan_devices: [0]      # run on Vulkan device 0

    cmd: |
      {llama}
        --model /models/llava-13b-q4_k_m.gguf
        --mmproj /models/llava-13b-mmproj.gguf
        --ctx-size 4096

  # --- Example 4: an audio.cpp model (TTS) ----------------------------------
  # audio.cpp models are spawned as one audiocpp_server process per model,
  # get the full lifecycle (idle-TTL eviction, queueing, auth), and are
  # reachable via /v1/audio/speech, /v1/audio/transcriptions, and
  # /v1/audio/voices.  context_length is meaningless here and omitted.
  # Requires the `audiocpp` cmd_alias above and a matching
  # /etc/llm-orch/audio/qwen3-tts.json (see config.example-audiocpp.json).
  # - name: "qwen3-tts"          # must equal the `id` in the server.json
  #   max_instances: 1
  #   max_concurrent: 1          # audiocpp serializes requests per model
  #   vram: 4000                 # declared VRAM usage (MB)
  #   idle_ttl: 300
  #   queue_depth: 5
  #   # vulkan_devices: [0]      # uncomment for GPU placement
  #   cmd: "{audiocpp}"

  # --- Example 5: speculative decoding with a draft model -------------------
  # When the command enables draft-model speculation — a draft-model flag
  # (`--spec-draft-model`, `-md`, `--model-draft`, or the `--spec-draft-hf`
  # variants) or `--spec-type draft-simple|draft-eagle3|draft-mtp` (incl.
  # internal MTP heads like Qwen3.6/3.8, which load into their own draft
  # context) — llm-orch automatically pins the draft to the same device(s)
  # the instance is placed on by appending `--spec-draft-device VulkanN,…`
  # (CUDA/ROCm prefixes for those namespaces) at spawn time.  Without it
  # llama.cpp runs the draft context on its process-default backend, which
  # is *not* the model's pinned device (e.g. HIP on a Vulkan-pinned model)
  # and can OOM against the already-loaded model.  Self-speculative ngram
  # types have no draft context and are never touched.  Declaring
  # `--spec-draft-device`/`--device-draft`/`-devd` in `cmd` is a config
  # error (llm-orch owns placement); `--spec-draft-ngl 0` is respected and
  # keeps the draft on the CPU — then no device pin is injected.
  # - name: "qwen3-32b-spec"
  #   context_length: 32768
  #   max_instances: 1
  #   max_concurrent: 4
  #   vram: 26000             # main model + draft model on one GPU
  #   idle_ttl: 600
  #   queue_depth: 10
  #   vulkan_devices: [[0]]   # or [[0],[1]] / [[0,1]] — the draft follows
  #   cmd: |
  #     {llama}
  #       --model /models/qwen3-32b-q4_k_m.gguf
  #       --ctx-size 32768
  #       --spec-draft-model /models/qwen3-1.7b-q4_k_m.gguf
  #       --spec-draft-ngl 99   # offload all draft layers

  # --- Example 6: a diffusion model (stable-diffusion.cpp) -------------------
  # sd-server is an entirely separate binary from llama-server.  Backend
  # selection is automatic: llm-orch detects `sd-server` in the command
  # basename and uses `StableDiffusionCppBackend` (no --device flag, only
  # the visibility env var).  GPU device pools are shared — vulkan_devices,
  # cuda_devices, and rocm_devices work identically.
  #
  # `context_length` is meaningless for diffusion models and should be 0.
  # `vram` hints the scheduler about VRAM usage (adjust for your model).
  # - name: "flux-1-dev"
  #   context_length: 0
  #   max_instances: 1
  #   max_concurrent: 1         # sd-server serializes requests internally
  #   vram: 16000                # FLUX.1-dev (~12-16 GB at FP16)
  #   idle_ttl: 600
  #   queue_depth: 5
  #   vulkan_devices: [0]
  #   cmd: |
  #     {sd}
  #       --diffusion-model /models/flux1-dev.safetensors
  #       --clip-l /models/clip-l.safetensors
  #       --t5xxl /models/t5xxl.safetensors
  #       --vae /models/ae.safetensors
  #       --diffusion-dtype auto
  #       --sampling-steps 28
  #       --w 1024
  #       --h 1024
  #
  # --- Example 7: MiniMax-H3 video generation ------------------------------
  # MiniMax-H3 jointly generates video and stereo audio.  The model needs
  # four component files: the diffusion transformer, video VAE, audio VAE,
  # and the Qwen3-VL-32B text encoder (truncated to 50 language layers).
  #
  # With 2× AMD R9700 32 GB this fits on one GPU at FP8 DiT + NVFP4 AWQ
  # text encoder (~25 GB total).  The `vram` value covers all four components.
  #
  # sd-server does not use llama.cpp's `--device` selector, only the
  # visibility env var (GGML_VK_VISIBLE_DEVICES / HIP_VISIBLE_DEVICES).
  # The existing `vulkan_devices` / `rocm_devices` pools work unchanged.
  #
  # Use `/v1/video/generations` (JSON) to generate or `/sdcpp/v1/vid_gen`
  # (passthrough, 202 + job id) for native async control.
  #
  # See also: scripts/generate-video.sh for a CLI wrapper.  For renders
  # that can exceed server.backend_total_timeout_secs, use
  # scripts/generate-video-async.sh instead: it submits through the native
  # async API and polls, so no single request has to survive the whole render.
  # - name: "minimax-h3"
  #   context_length: 0
  #   max_instances: 1
  #   max_concurrent: 1           # sd-server serialises requests internally
  #   vram: 28000                 # DiT (~14 GB) + text encoder (~10 GB)
  #                               # + VAEs (~3 GB) + working memory
  #   idle_ttl: 900               # keep loaded between prompts
  #   queue_depth: 3
  #   vulkan_devices: [0]         # or rocm_devices; both GPUs available
  #   cmd: |
  #     sd-server
  #       --host 127.0.0.1
  #       --port {port}
  #       --diffusion-model /data/llama/stable-diffusion/MiniMax-H3/minimax_h3_fl2va_pruned_fp8_scaled.safetensors
  #       --vae /data/llama/stable-diffusion/MiniMax-H3/minimax_h3_video_vae_fp16.safetensors
  #       --audio-vae /data/llama/stable-diffusion/MiniMax-H3/minimax_h3_audio_vae_fp32.safetensors
  #       --llm /data/llama/stable-diffusion/Qwen3-VL-32B/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
  #       --backend vulkan
  #       --diffusion-fa           # flash attention
  #       --cfg-scale 1.0
  #       --rng cpu
  #       --fps 24

  # --- Example 7b: MOSS-Image-Base (text-to-image) ---------------------------
  # MOSS-Image is a 5B diffusion transformer that reuses the FLUX.2 VAE and
  # Qwen3.5-9B as its text encoder, so one instance needs four files (see
  # docs/moss_image.md in stable-diffusion.cpp):
  #   transformer   leejet/MOSS-Image-Base-GGUF          Q4_K 3.3 GB … Q8_0 5.7 GB
  #   text encoder  unsloth/Qwen3.5-9B-GGUF             Q4_K_M ~5.7 GB
  #   vae           Comfy-Org/MOSS-Image vae/flux2-vae.safetensors
  #   tokenizer     OpenMOSS-Team/MOSS-Image-Base  tokenizer/tokenizer.json
  # The `--tokenizer` file is required — Qwen3.5's vocabulary differs from the
  # Qwen tokenizer embedded in the encoder GGUF.  sd-server must be built from
  # a 2026-10-16 or newer tree, which is when MOSS support landed.
  # MOSS house style: cfg 3, 20 steps, 1024x1024, euler, flow shift 5, and
  # dimensions divisible by 16.  These CLI values are the *defaults* a request
  # inherits; a request may override any of them.
  # - name: "moss"
  #   context_length: 0
  #   max_instances: 1
  #   max_concurrent: 1           # sd-server serialises requests internally
  #   vram: 12000                 # DiT + Qwen3.5 encoder + VAE + working memory
  #   idle_ttl: 600
  #   queue_depth: 5
  #   vulkan_devices: [0]
  #   cmd: |
  #     sd-server
  #       --host 127.0.0.1
  #       --port {port}
  #       --diffusion-model /data/llama/stable-diffusion/MOSS-Image/MOSS-Image-Base-Q4_K.gguf
  #       --llm /data/llama/stable-diffusion/MOSS-Image/Qwen3.5-9B-Q4_K_M.gguf
  #       --vae /data/llama/stable-diffusion/MOSS-Image/flux2-vae.safetensors
  #       --tokenizer /data/llama/stable-diffusion/MOSS-Image/tokenizer_qwen3.5.json
  #       --backend vulkan
  #       --diffusion-fa
  #       --cfg-scale 3.0
  #       --steps 20
  #       --width 1024
  #       --height 1024
  #
  # Render through /v1/images/generations; scripts/generate-image.sh wraps it
  # with MOSS-matching defaults and smuggles native sd-server controls
  # (seed, sampler, negative prompt, lora, …) into the request via the
  # `<sd_cpp_extra_args>` prompt extension.

  # --- Example 8: a remote http(s) endpoint (pure passthrough) -----------
  # A model whose `cmd` is an `http://` / `https://` URL is detected
  # automatically as a *remote* model: llm-orch spawns no process and
  # allocates no port or GPU — the first request health-probes
  # `GET {cmd}/health` (10 s budget) and registers the endpoint as a
  # single passthrough instance.
  #
  # Lifecycle differences vs. local models:
  # - `autoscale` is a config error (there is nothing to scale);
  # - device pools, `vram`, and `gpus > 1` are config errors;
  # - the instance is never idle-evicted and is never "killed" on config
  #   reload or shutdown (there is no local process) — it is re-probed on
  #   the next request, so a down endpoint recovers without operator
  #   intervention;
  # - a failed probe does not block the model (unlike pre-output process
  #   crashes); with `queue_depth: 0` it surfaces as a 429, otherwise the
  #   request queues and a later request re-probes;
  # - EMA load/latency metrics work as usual (in-flight + queued counts).
  #
  # `remote_auth` is sent as the `Authorization` header on every forwarded
  # request; `{name}` placeholders resolve against `key_files` at request
  # time, so rotating the key file (or hot-reloading the config) applies
  # immediately without instance replacement.
  # - name: "remote-qwen"
  #   context_length: 32768
  #   max_instances: 1
  #   max_concurrent: 8          # concurrency cap on the remote endpoint
  #   queue_depth: 10
  #   cmd: "https://gpu-host.example.com:8080"
  #   remote_auth: "Bearer {deploy_key}"

# ---------------------------------------------------------------------------
# Aliases
# ---------------------------------------------------------------------------
# Aliases present an alternative name that routes to one or more underlying
# models.  They appear in /v1/models so clients can discover them.
#
# `targets` is an ordered candidate list: later entries are spillover for
# when an earlier entry cannot be served or loaded.  The legacy scalar
# form `target: <name>` is still accepted as a one-element list.
#
# Per-alias settings (see docs/003-smart-handling.md):
#   policy:      prefer_loaded (default) — serve from any already-loaded
#                candidate before spawning; prefer_order — try candidates
#                strictly in order (warm slot → spawn → make-room).
#   make_room:   none | evict_idle (default) | drain_surplus | migrate — what
#                may happen when the preferred candidate does not fit:
#                evict_idle removes idle instances past their model's
#                idle_ttl protection; drain_surplus additionally drains
#                busy *duplicate* instances (never the last one serving a
#                model); migrate re-uploads an eligible victim on another
#                GPU before loading the preferred model and never interrupts
#                active requests.  Migration is alias-only and opt-in.
#   drain_timeout: bound (seconds, default 300) on waiting for a busy
#                duplicate to drain when make_room: drain_surplus.
aliases:
  - name: "qwen"
    target: "qwen3-32b"          # scalar form == targets: [qwen3-32b]

  - name: "summarize"
    # Prefer the big model; spill over to the small one when the big one
    # cannot be served or loaded (make_room may evict stale idle instances
    # to fit qwen3-32b).
    targets: ["qwen3-32b", "deepseek-coder-7b"]
    policy: prefer_loaded
    make_room: evict_idle

  - name: "coder"
    target: "deepseek-coder-7b"

  # Transactional migration is explicit and only applies to aliases.  The
  # target model is queued while an eligible victim is re-uploaded elsewhere.
  # - name: "preferred-large"
  #   targets: ["qwen3-32b"]
  #   policy: prefer_order
  #   make_room: migrate
